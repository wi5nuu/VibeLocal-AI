steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vibelocal-nextjs:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vibelocal-nextjs:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vibelocal-nextjs:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vibelocal-nextjs'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vibelocal-nextjs:$SHORT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/vibelocal-nextjs:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/vibelocal-nextjs:latest'

# Timeout for build
options:
  logging: CLOUD_LOGGING_ONLY
